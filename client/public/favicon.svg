<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background subtle dark gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#180203" />
      <stop offset="65%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Deep drop shadow for the 3D folded ribbon diagonal -->
    <filter id="ribbonShadow" x="-35%" y="-25%" width="170%" height="150%">
      <feDropShadow dx="-4" dy="0" stdDeviation="4.5" flood-color="#000000" flood-opacity="0.95" />
      <feDropShadow dx="4" dy="0" stdDeviation="4.5" flood-color="#000000" flood-opacity="0.95" />
    </filter>

    <!-- Left & Right Vertical Legs: Deep Netflix shadow crimson -->
    <linearGradient id="legGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B81D24" />
      <stop offset="50%" stop-color="#990008" />
      <stop offset="100%" stop-color="#550004" />
    </linearGradient>

    <!-- Center Diagonal Ribbon: Vibrant Netflix iconic red with light highlight -->
    <linearGradient id="ribbonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF242E" />
      <stop offset="35%" stop-color="#E50914" />
      <stop offset="85%" stop-color="#D10610" />
      <stop offset="100%" stop-color="#A50007" />
    </linearGradient>
  </defs>

  <!-- Deep Black Rounded Square -->
  <rect width="128" height="128" rx="26" fill="url(#bgGlow)" />
  <rect width="128" height="128" rx="26" fill="none" stroke="rgba(229, 9, 20, 0.4)" stroke-width="2" />

  <!-- Left Leg (Underneath) -->
  <path d="M 26 21 L 48 21 L 48 107 L 26 107 Z" fill="url(#legGradient)" />

  <!-- Right Leg (Underneath) -->
  <path d="M 80 21 L 102 21 L 102 107 L 80 107 Z" fill="url(#legGradient)" />

  <!-- Center Diagonal Ribbon (On Top with 3D Ribbon Shadow) -->
  <path d="M 26 21 L 48 21 L 102 107 L 80 107 Z" fill="url(#ribbonGradient)" filter="url(#ribbonShadow)" />
</svg>
